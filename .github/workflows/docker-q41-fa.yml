name: Build llama.cpp CUDA q4_1 FA

on:
  workflow_dispatch:

  push:
    branches:
      - b10902-q4_1

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/llama.cpp

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push CUDA server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server

          platforms: linux/amd64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:server-cuda12-b10902-q41fa
            ${{ env.IMAGE_NAME }}:server-cuda12-q41fa
            ${{ env.IMAGE_NAME }}:server-cuda12-q41fa-${{ github.sha }}

          build-args: |
            CUDA_DOCKER_ARCH=89
            GGML_CUDA_FA_QUANTS=q4_0-q4_0;q4_1-q4_1;q8_0-q8_0;f16-f16;bf16-bf16
            APP_VERSION=b10902-q41fa
            APP_REVISION=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max